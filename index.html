    const photosTab = document.getElementById('tab-photos');
    C.portfolio.photos.forEach(photo => {
        const div = document.createElement('div');
        div.className = 'gallery-item rounded-xl overflow-hidden shadow-md bg-white';
        div.innerHTML = `
            <div class="aspect-[3/2] overflow-hidden">
                <img src="${photo.url}" alt="${photo.caption}" class="w-full h-full object-cover" loading="lazy">
            </div>
            <p class="p-3 text-sm text-brand-600 text-center">${photo.caption}</p>
        `;
        photosTab.appendChild(div);
    });

    // 视频 — B站iframe嵌入（补全协议相对URL）
    const videosTab = document.getElementById('tab-videos');
    C.portfolio.videos.forEach(video => {
        const src = video.url.startsWith('//') ? 'https:' + video.url : video.url;
        const div = document.createElement('div');
        div.className = 'rounded-xl overflow-hidden shadow-md bg-white';
        div.innerHTML = `
            <div class="aspect-video">
                <iframe src="${src}" scrolling="no" border="0" frameborder="0"
                        allowfullscreen="true"
                        class="w-full h-full">
                </iframe>
            </div>
            <p class="p-4 text-sm text-brand-600 text-center font-medium">${video.title}</p>
        `;
        videosTab.appendChild(div);
    });

    // 项目作品卡片
    const projectsTab = document.getElementById('tab-projects');
    C.portfolio.projects.forEach(proj => {
        const div = document.createElement('div');
        div.className = 'project-card bg-white rounded-xl overflow-hidden shadow-md border border-brand-100';
        div.innerHTML = `
            <div class="aspect-video overflow-hidden">
                <img src="${proj.screenshot}" alt="${proj.name}" class="w-full h-full object-cover" loading="lazy">
            </div>
            <div class="p-5">
                <span class="inline-block px-2.5 py-0.5 bg-brand-100 text-brand-600 text-xs font-medium rounded-full mb-2">${proj.tag}</span>
                <h4 class="text-lg font-semibold text-brand-900 mb-2">${proj.name}</h4>
                <p class="text-sm text-brand-500 leading-relaxed mb-4">${proj.desc}</p>
                <a href="${proj.url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-sm font-medium text-brand-700 hover:text-brand-900 transition-colors">
                    查看项目
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </a>
            </div>
        `;
        projectsTab.appendChild(div);
    });

    // Tab 切换逻辑
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const targetTab = btn.dataset.tab;
            // 更新按钮状态
            tabBtns.forEach(b => {
                b.classList.remove('active', 'text-brand-900', 'border-brand-900');
                b.classList.add('text-brand-400', 'border-transparent');
            });
            btn.classList.add('active', 'text-brand-900', 'border-brand-900');
            btn.classList.remove('text-brand-400', 'border-transparent');
            // 切换内容
            tabContents.forEach(tc => tc.classList.add('hidden'));
            document.getElementById('tab-' + targetTab).classList.remove('hidden');
        });
    });

    /* ========== 5. 渲染技能&经历 ========== */
    // 工作经历时间轴
    const timeline = document.getElementById('experience-timeline');
    C.experiences.forEach((exp, i) => {
        const div = document.createElement('div');
        div.className = 'relative pl-10 pb-10 last:pb-0';
        div.innerHTML = `
            <div class="timeline-line bg-brand-200"></div>
            <div class="absolute left-0 top-0 w-6 h-6 rounded-full border-2 border-brand-400 bg-white flex items-center justify-center">
                <div class="w-2 h-2 rounded-full bg-brand-500"></div>
            </div>
            <span class="text-xs font-medium text-brand-400 uppercase tracking-wider">${exp.period}</span>
            <h4 class="text-lg font-semibold text-brand-900 mt-1">${exp.role}</h4>
            <p class="text-sm text-brand-500 mt-0.5">${exp.company}</p>
            <p class="text-sm text-brand-600 mt-2 leading-relaxed">${exp.desc}</p>
        `;
        timeline.appendChild(div);
    });

    // 专业技能
    const skillsContainer = document.getElementById('skills-container');
    C.skills.forEach(skill => {
        const div = document.createElement('div');
        div.innerHTML = `
            <div class="flex justify-between items-center mb-1.5">
                <span class="text-sm font-medium text-brand-700">${skill.name}</span>
                <span class="text-xs text-brand-400">${skill.level}%</span>
            </div>
            <div class="w-full h-2 bg-brand-100 rounded-full overflow-hidden">
                <div class="h-full bg-brand-500 rounded-full skill-bar" style="width: 0%" data-width="${skill.level}%"></div>
            </div>
        `;
        skillsContainer.appendChild(div);
    });

    /* ========== 6. 渲染联系方式 ========== */
    const contactEmail = document.getElementById('contact-email');
    contactEmail.href = 'mailto:' + C.contact.email;
    contactEmail.textContent = C.contact.email;

    // 社交图标 SVG 映射
    const iconSVGs = {
        github: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>',
        wechat: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.952-7.062-6.122zm-2.18 2.769c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"/></svg>',
        weibo: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10.098 20.323c-3.977.391-7.414-1.406-7.672-4.02-.259-2.609 2.759-5.047 6.74-5.441 3.979-.394 7.413 1.404 7.671 4.018.259 2.6-2.759 5.049-6.739 5.443zm-4.516-3.934c.855.125 1.625-.2 1.717-.727.095-.527-.515-1.055-1.371-1.179-.856-.126-1.621.2-1.716.727-.092.524.517 1.054 1.37 1.179zm3.959-2.005c.373.235.529.691.349 1.018-.178.328-.633.424-1.009.189-.375-.235-.528-.689-.349-1.018.18-.329.633-.424 1.009-.189zm4.257-2.451c-.267.82-1.328 1.402-2.367 1.3-1.038-.1-1.662-.858-1.394-1.679.268-.819 1.334-1.399 2.373-1.298 1.039.101 1.66.859 1.388 1.677zm1.232-1.809c-1.098-.409-2.309-.148-3.003.571-.149.155-.207.34-.144.407.062.067.273.043.504-.064.617-.287 1.391-.42 1.97-.287.151.035.281-.015.313-.134.045-.158-.034-.339-.19-.422.285.307.46.728.368 1.171-.13.631-.569 1.17-1.06 1.53zm6.254-2.008c-.687-1.805-2.083-3.189-3.721-4.021-1.326-.673-2.851-.881-4.271-.64.66-.487 1.484-.74 2.313-.722 1.851.039 3.593 1.108 4.443 2.66.834 1.524.717 3.368-.333 4.661.292-.452.465-1.022.441-1.6-.039-.942-.452-1.703-1.125-2.069.67.419 1.268 1.06 1.523 1.812.266.788.155 1.621-.224 2.287.223-.498.294-1.087.154-1.646-.084-.338-.238-.649-.424-.919.43.484.644 1.192.504 1.873-.076.366-.233.695-.452.965.536-.921.668-2.131.239-3.241z"/></svg>',
        linkedin: '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
    };

    const socialDiv = document.getElementById('social-links');
    C.contact.social.forEach(s => {
        const a = document.createElement('a');
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.className = 'text-brand-300 hover:text-white transition-colors';
        a.title = s.name;
        a.innerHTML = iconSVGs[s.icon] || '';
        socialDiv.appendChild(a);
    });

    const ctaBtn = document.getElementById('contact-cta');
    ctaBtn.href = 'mailto:' + C.contact.email;
    ctaBtn.textContent = C.contact.ctaText;

    /* ========== 7. 渲染页脚 ========== */
    document.getElementById('footer-text').textContent = C.footer.copyright;

    /* ========== 8. 移动端菜单切换 ========== */
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
    });
    // 点击菜单项后关闭
    mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
        });
    });

    /* ========== 9. Intersection Observer 滚动渐入动画 ========== */
    const fadeEls = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

    fadeEls.forEach(el => observer.observe(el));

    /* ========== 10. 技能进度条进入视口后动画 ========== */
    const skillObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const bars = entry.target.querySelectorAll('.skill-bar');
                bars.forEach(bar => {
                    bar.style.width = bar.dataset.width;
                });
                skillObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.3 });

    const skillsContainerEl = document.getElementById('skills-container');
    if (skillsContainerEl) skillObserver.observe(skillsContainerEl);

})();
</script>
